<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splunk Enterprise Multi-Cluster Architecture & Complete Knowledge System</title>
    <style>
        :root {
            --bg-base: #070a13;
            --bg-secondary: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0a0f1d;
            --border: #334155;
            --border-highlight: #38bdf8;
            --accent-green: #10b981;
            --accent-blue: #38bdf8;
            --accent-orange: #f97316;
            --accent-purple: #c084fc;
            --accent-pink: #f43f5e;
            --accent-yellow: #facc15;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 2px solid var(--border);
            padding: 8px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
            z-index: 100;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--accent-green);
            white-space: nowrap;
        }

        .mode-nav {
            display: flex;
            background: var(--bg-input);
            padding: 2px;
            border-radius: 8px;
            border: 1px solid var(--border);
            gap: 2px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 5px 8px;
            font-size: 0.72rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--accent-blue);
            color: var(--bg-base);
        }

        .search-container {
            flex: 1;
            max-width: 320px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 6px 10px 6px 30px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.8rem;
            outline: none;
        }

        .search-input:focus { border-color: var(--accent-blue); }

        .search-icon {
            position: absolute;
            left: 9px;
            top: 50%;
            transform: translateY(-50%);
            fill: var(--text-muted);
            width: 13px;
            height: 13px;
        }

        .dropdown {
            position: absolute;
            top: 38px;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--accent-blue);
            border-radius: 6px;
            max-height: 380px;
            overflow-y: auto;
            z-index: 200;
            display: none;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
        }

        .dropdown-item {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        .dropdown-item:hover { background: var(--bg-card); }
        .dropdown-q { font-size: 0.8rem; font-weight: 600; color: var(--accent-blue); }
        .dropdown-desc { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
            overflow: hidden;
            position: relative;
        }

        .canvas-container {
            flex: 1;
            background: radial-gradient(circle at center, #131c2d 0%, #070a13 100%);
            overflow: hidden;
            position: relative;
            cursor: grab;
        }

        .canvas-container:active { cursor: grabbing; }

        .zoom-controls {
            position: absolute;
            bottom: 18px;
            left: 18px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 20;
        }

        .zoom-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 30px;
            height: 30px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zoom-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

        .sim-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 20;
        }

        .sim-label { font-size: 0.74rem; font-weight: 700; color: var(--accent-orange); text-transform: uppercase; }

        .sim-select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.76rem;
            outline: none;
            flex: 1;
            max-width: 520px;
        }

        .sim-btn-trigger {
            background: var(--accent-pink);
            border: none;
            color: white;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.74rem;
            font-weight: 700;
            cursor: pointer;
        }

        .sim-btn-reset {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.74rem;
            cursor: pointer;
        }

        #viewportGroup { transform-origin: 0 0; }
        svg { width: 100%; height: 100%; user-select: none; }

        .tier-bg { fill: rgba(30, 41, 59, 0.28); stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; rx: 10; }
        .mgmt-column-bg { fill: rgba(19, 27, 46, 0.6); stroke: #475569; stroke-width: 1.5; stroke-dasharray: 5 3; rx: 12; }
        .tier-title { fill: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

        .node { cursor: pointer; transition: all 0.2s; }
        .node rect { rx: 6; stroke-width: 1.5; fill: #111a2e; }
        .node text.title { fill: #ffffff; font-size: 12px; font-weight: 600; }
        .node text.desc { fill: var(--text-muted); font-size: 10px; }

        .node:hover rect { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.7)); }
        .node.active rect { stroke: #ffffff !important; stroke-width: 2.5 !important; filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.9)); }
        
        .node.alarm-red rect { stroke: var(--accent-red) !important; fill: rgba(239, 68, 68, 0.22) !important; filter: drop-shadow(0 0 16px rgba(239, 68, 68, 0.9)); animation: pulseAlarm 1.4s infinite; }
        .node.alarm-amber rect { stroke: var(--accent-orange) !important; fill: rgba(249, 115, 22, 0.2) !important; filter: drop-shadow(0 0 12px rgba(249, 115, 22, 0.8)); }

        @keyframes pulseAlarm {
            0%, 100% { stroke-opacity: 1; }
            50% { stroke-opacity: 0.35; }
        }

        .pipe-line { stroke-width: 1.5; stroke-dasharray: 4 2; animation: flowAnim 15s linear infinite; fill: none; }
        .pipe-severed { stroke: var(--accent-red) !important; stroke-dasharray: 2 4 !important; animation: none !important; opacity: 0.4; }

        @keyframes flowAnim { to { stroke-dashoffset: -100; } }

        .sidebar {
            width: 580px;
            background: var(--bg-secondary);
            border-left: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: relative;
            transition: width 0.3s;
        }

        .sidebar.closed { display: none; }

        .sidebar-header {
            padding: 12px 18px;
            background: rgba(11, 15, 25, 0.7);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title { font-size: 1.05rem; color: var(--accent-blue); font-weight: 700; }
        .sidebar-tag { font-size: 0.72rem; color: var(--accent-green); background: var(--bg-card); padding: 2px 7px; border-radius: 8px; font-weight: 600; margin-top: 3px; display: inline-block; }
        .close-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); font-size: 1.1rem; line-height: 1; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
        .close-btn:hover { color: #fff; background: var(--bg-card); border-color: var(--accent-pink); }

        .open-sidebar-btn {
            display: none;
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--bg-card);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 5px 11px;
            border-radius: 6px;
            font-size: 0.76rem;
            font-weight: 600;
            cursor: pointer;
            z-index: 50;
        }

        .sidebar-content {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card { background: var(--bg-base); border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
        .card.alarm-card { border-color: var(--accent-red); background: rgba(239, 68, 68, 0.08); }
        .card-heading { font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent-purple); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .code-box { background: #000000; border-radius: 4px; padding: 7px 9px; font-family: var(--font-mono); font-size: 0.76rem; color: var(--accent-blue); margin-top: 5px; overflow-x: auto; line-height: 1.35; white-space: pre; }
        
        .bullet-list { list-style: none; display: flex; flex-direction: column; gap: 7px; font-size: 0.81rem; color: #d1d5db; }
        .bullet-list li { padding-left: 12px; position: relative; line-height: 1.4; }
        .bullet-list li::before { content: "•"; position: absolute; left: 0; color: var(--accent-orange); font-weight: bold; }

        .cascade-step {
            border-left: 2px solid var(--accent-blue);
            padding-left: 10px;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }
        .cascade-layer { font-weight: 700; color: var(--accent-blue); font-size: 0.76rem; }
        .cascade-val { font-family: var(--font-mono); color: var(--text-main); }
        .cascade-winner { border-left-color: var(--accent-green); }
        .cascade-winner .cascade-layer { color: var(--accent-green); }

        .packet-stage-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 0.74rem;
            cursor: pointer;
            margin-right: 4px;
            margin-bottom: 4px;
        }
        .packet-stage-btn.active {
            background: var(--accent-blue);
            color: var(--bg-base);
            font-weight: 700;
        }

        .generator-select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 7px;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            Splunk Distributed Studio
        </div>

        <div class="mode-nav">
            <button class="mode-btn active" onclick="switchToolView('inspector')">Inspector</button>
            <button class="mode-btn" onclick="switchToolView('packet')">Packet Tracer</button>
            <button class="mode-btn" onclick="switchToolView('mapreduce')">MapReduce</button>
            <button class="mode-btn" onclick="switchToolView('bundlediff')">Bundle Diff</button>
            <button class="mode-btn" onclick="switchToolView('generator')">Stanza Gen</button>
            <button class="mode-btn" onclick="switchToolView('cascade')">Btool Tree</button>
            <button class="mode-btn" onclick="switchToolView('simulator')">Failure Sim (15)</button>
        </div>

        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search architecture, search affinity, btool, KV store...">
            <div id="dropdownPanel" class="dropdown"></div>
        </div>
    </header>

    <div class="workspace">
        <button id="openSidebarBtn" class="open-sidebar-btn" onclick="toggleSidebar(true)">← Open Drawer</button>

        <div class="canvas-container" id="canvasStage">
            
            <div class="sim-bar" id="simFloatingBar" style="display: none;">
                <span class="sim-label">Failure Injection:</span>
                <select class="sim-select" id="simScenarioSelect">
                    <option value="site1_drop">01. Disaster Recovery: Site 1 Peer Indexer Cluster Outage</option>
                    <option value="captain_partition">02. SHC Consensus: Captain Lost / Raft Quorum Split-Brain</option>
                    <option value="forwarder_block">03. Ingestion Queue: Port 9997 Saturation / Blocked Pipe</option>
                    <option value="smartstore_thrash">04. Storage Tier: S3 Rate Throttling & Cache Eviction Thrash</option>
                    <option value="license_violation">05. License Violations: 5 Daily Pool Breaches / Search Locked</option>
                    <option value="indexer_disk_full">06. Peer Storage: minFreeSpace Breached (Ingestion Halted)</option>
                    <option value="bucket_fixup_storm">07. Indexer Cluster: Flapping Peer Triggers Fixup Storm</option>
                    <option value="deployer_conflict">08. SHC Deployer: App Push Bundle Overwrites CSV Lookups</option>
                    <option value="shc_out_of_sync">09. Search Head Desync: Member Falls Out of Raft Replication</option>
                    <option value="port_drop_9997">10. Firewall Drop: Port 9997 Drops Ingestion Traffic</option>
                    <option value="wan_latency_spike">11. Inter-Site WAN Latency: Bucket Replication Times Out (9887)</option>
                    <option value="fishbucket_corrupt">12. Forwarder Loop: Fishbucket Corruption Causes Re-indexing</option>
                    <option value="search_bundle_exhaust">13. Distsearch Bundle: Large CSVs Exhaust Peer /tmp Space</option>
                    <option value="cm_split_brain">14. Management Partition: Cluster Manager Unreachable by SHC</option>
                    <option value="hec_queue_overflow">15. API Ingestion: HEC HTTP 503 Gateway Pipeline Overflow</option>
                </select>
                <button class="sim-btn-trigger" onclick="runSimulation()">Inject Outage</button>
                <button class="sim-btn-reset" onclick="resetSimulation()">Reset Topology</button>
            </div>

            <div class="zoom-controls">
                <button class="zoom-btn" onclick="zoomCanvas(1.15)" title="Zoom In">+</button>
                <button class="zoom-btn" onclick="zoomCanvas(0.85)" title="Zoom Out">−</button>
                <button class="zoom-btn" onclick="resetZoom()" title="Reset Canvas">⟲</button>
            </div>

            <svg id="architectureSvg" viewBox="0 0 1060 880">
                <g id="viewportGroup">
                    
                    <rect x="810" y="20" width="220" height="840" class="mgmt-column-bg"/>
                    <text x="825" y="44" class="tier-title" fill="#c084fc">Management Plane</text>

                    <g class="node" id="node-shc_deployer" onclick="selectComponent('shc_deployer')">
                        <rect x="825" y="65" width="190" height="110" stroke="#f43f5e"/>
                        <path d="M 837 77 l 5 -3 l 5 3 l -5 3 z M 837 80 l 5 3 l 0 6 l -5 -3 z M 847 80 l -5 3 l 0 6 l 5 -3 z" fill="none" stroke="#f43f5e" stroke-width="1.2"/>
                        <text x="852" y="85" class="title">SHC Deployer</text>
                        <text x="835" y="110" class="desc">Distributes App Baselines</text>
                        <text x="835" y="130" class="desc">to Search Head Cluster</text>
                        <text x="835" y="155" class="desc" fill="#f43f5e">shcluster/apps</text>
                    </g>

                    <g class="node" id="node-cm" onclick="selectComponent('cm')">
                        <rect x="825" y="325" width="190" height="120" stroke="#c084fc"/>
                        <circle cx="840" cy="341" r="3.5" fill="none" stroke="#c084fc" stroke-width="1.2"/>
                        <circle cx="834" cy="351" r="2.5" fill="none" stroke="#c084fc" stroke-width="1.2"/>
                        <circle cx="846" cy="351" r="2.5" fill="none" stroke="#c084fc" stroke-width="1.2"/>
                        <path d="M 840 344 L 834 348 M 840 344 L 846 348" stroke="#c084fc" stroke-width="1.2"/>
                        <text x="853" y="347" class="title">Cluster Manager (CM)</text>
                        <text x="835" y="372" class="desc">Peer State & Bucket Fixup</text>
                        <text x="835" y="392" class="desc">Pushes Indexer Bundle</text>
                        <text x="835" y="422" class="desc" fill="#c084fc">master-apps / _cluster</text>
                    </g>

                    <g class="node" id="node-ds" onclick="selectComponent('ds')">
                        <rect x="825" y="590" width="190" height="105" stroke="#f97316"/>
                        <rect x="835" y="601" width="10" height="8" rx="1" fill="none" stroke="#f97316" stroke-width="1.2"/>
                        <path d="M 837 613 l 6 0 M 840 609 l 0 4" stroke="#f97316" stroke-width="1.2"/>
                        <text x="850" y="610" class="title">Deployment Server (DS)</text>
                        <text x="835" y="635" class="desc">Forwarder App Delivery</text>
                        <text x="835" y="655" class="desc">serverclass.conf</text>
                        <text x="835" y="675" class="desc" fill="#f97316">deployment-apps</text>
                    </g>

                    <g class="node" id="node-lm" onclick="selectComponent('lm')">
                        <rect x="825" y="720" width="190" height="90" stroke="#64748b"/>
                        <rect x="835" y="731" width="10" height="12" rx="1.5" fill="none" stroke="#64748b" stroke-width="1.2"/>
                        <path d="M 838 737 l 4 0 M 838 739 l 3 0" stroke="#64748b" stroke-width="1.2"/>
                        <text x="850" y="742" class="title">License Manager</text>
                        <text x="835" y="765" class="desc">Enterprise Pool Quotas</text>
                        <text x="835" y="785" class="desc" fill="#94a3b8">Daily Ingest Tracking</text>
                    </g>

                    <path id="pipe-deployer-shc" d="M 825 120 L 700 120" stroke="#f43f5e" stroke-dasharray="3 3"/>
                    <text x="720" y="112" font-size="9" fill="#f43f5e">shcluster-bundle</text>

                    <path id="pipe-cm-idx" d="M 825 385 L 700 385" stroke="#c084fc" stroke-dasharray="3 3"/>
                    <text x="725" y="377" font-size="9" fill="#c084fc">cluster-bundle</text>

                    <path id="pipe-ds-uf" d="M 825 645 L 700 645" stroke="#f97316" stroke-dasharray="3 3"/>
                    <text x="728" y="637" font-size="9" fill="#f97316">phoneHome</text>

                    <rect x="20" y="20" width="680" height="200" class="tier-bg"/>
                    <text x="35" y="44" class="tier-title">Tier 3: Search Head Cluster (SHC) - Search Affinity & KV Store</text>

                    <g class="node" id="node-sh_captain" onclick="selectComponent('sh_captain')">
                        <rect x="35" y="65" width="205" height="135" stroke="#38bdf8"/>
                        <polygon points="46,84 48,76 52,80 56,76 58,84" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
                        <text x="64" y="83" class="title">SHC Captain (Site 1)</text>
                        <text x="45" y="106" class="desc">Scheduler & KV Store Primary</text>
                        <text x="45" y="126" class="desc">Raft Engine (Port 8089)</text>
                        <text x="45" y="148" class="desc" fill="#38bdf8">Search Affinity: Site 1 Target</text>
                        <text x="45" y="168" class="desc" fill="#94a3b8">users/ & apps/local/</text>
                        <text x="45" y="186" class="desc" fill="#10b981">Local TSIDX Read (No WAN)</text>
                    </g>

                    <g class="node" id="node-sh_member1" onclick="selectComponent('sh_member')">
                        <rect x="260" y="65" width="205" height="135" stroke="#38bdf8"/>
                        <circle cx="273" cy="80" r="4.5" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
                        <line x1="276" y1="83" x2="280" y2="87" stroke="#38bdf8" stroke-width="1.2"/>
                        <text x="286" y="83" class="title">SH Member (Site 1)</text>
                        <text x="270" y="106" class="desc">Ad-hoc Search Dispatch</text>
                        <text x="270" y="126" class="desc">Artifact Replication</text>
                        <text x="270" y="148" class="desc" fill="#38bdf8">Queries Local Site 1 Peers</text>
                        <text x="270" y="168" class="desc" fill="#94a3b8">KV Store Member (8191)</text>
                        <text x="270" y="186" class="desc" fill="#10b981">distsearch.conf: site1</text>
                    </g>

                    <g class="node" id="node-sh_member2" onclick="selectComponent('sh_member')">
                        <rect x="485" y="65" width="200" height="135" stroke="#38bdf8"/>
                        <circle cx="498" cy="80" r="4.5" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
                        <line x1="501" y1="83" x2="505" y2="87" stroke="#38bdf8" stroke-width="1.2"/>
                        <text x="511" y="83" class="title">SH Member (Site 2)</text>
                        <text x="495" y="106" class="desc">Ad-hoc Search Dispatch</text>
                        <text x="495" y="126" class="desc">Artifact Replication</text>
                        <text x="495" y="148" class="desc" fill="#38bdf8">Search Affinity: Site 2 Peers</text>
                        <text x="495" y="168" class="desc" fill="#94a3b8">KV Store Member (8191)</text>
                        <text x="495" y="186" class="desc" fill="#10b981">distsearch.conf: site2</text>
                    </g>

                    <path id="pipe-shc-site1" d="M 140 280 L 140 220" stroke="#38bdf8" class="pipe-line"/>
                    <path id="pipe-shc-site2" d="M 580 280 L 580 220" stroke="#38bdf8" class="pipe-line"/>
                    <text x="240" y="250" font-size="10" fill="#38bdf8">Search Affinity: Local Search Factor Read (Zero WAN Traffic)</text>

                    <rect x="20" y="280" width="680" height="240" class="tier-bg"/>

    <script>
        let currentZoom = 1;
        let panX = 0, panY = 0;
        let isPanning = false;
        let startX, startY;
        let activeToolView = 'inspector';

        const viewportGroup = document.getElementById('viewportGroup');
        const canvasStage = document.getElementById('canvasStage');

        canvasStage.addEventListener('mousedown', (e) => {
            if (e.target.closest('.sim-bar') || e.target.closest('.zoom-controls')) return;
            isPanning = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => { isPanning = false; });

        canvasStage.addEventListener('wheel', (e) => {
            e.preventDefault();
            const factor = e.deltaY > 0 ? 0.9 : 1.1;
            zoomCanvas(factor);
        }, { passive: false });

        function updateTransform() {
            viewportGroup.setAttribute('transform', `translate(${panX}, ${panY}) scale(${currentZoom})`);
        }

        function zoomCanvas(factor) {
            currentZoom = Math.min(Math.max(0.4, currentZoom * factor), 2.5);
            updateTransform();
        }

        function resetZoom() {
            currentZoom = 1;
            panX = 0;
            panY = 0;
            updateTransform();
        }

        function toggleSidebar(open) {
            const sidebar = document.getElementById('sidebar');
            const openBtn = document.getElementById('openSidebarBtn');
            if (open) {
                sidebar.classList.remove('closed');
                openBtn.style.display = 'none';
            } else {
                sidebar.classList.add('closed');
                openBtn.style.display = 'block';
            }
        }

        function switchToolView(viewMode) {
            activeToolView = viewMode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const simBar = document.getElementById('simFloatingBar');
            simBar.style.display = (viewMode === 'simulator') ? 'flex' : 'none';

            toggleSidebar(true);

            if (viewMode === 'inspector') {
                selectComponent('sh_captain');
            } else if (viewMode === 'packet') {
                renderPacketTracer();
            } else if (viewMode === 'mapreduce') {
                renderMapReduceVisualizer();
            } else if (viewMode === 'bundlediff') {
                renderBundleDiffImpact();
            } else if (viewMode === 'generator') {
                renderStanzaGenerator();
            } else if (viewMode === 'cascade') {
                renderCascadeTree();
            } else if (viewMode === 'simulator') {
                renderSimulatorRunbook();
            }
        }

        const splunkComponents = {

            document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));

            if (el) el.classList.add('active');

        function selectComponent(key, directQA = null) {
            if (activeToolView !== 'inspector') switchToolView('inspector');
            const data = splunkComponents[key];
            if (!data) return;

            highlightNode(key);
            toggleSidebar(true);

            document.getElementById('sideTitle').innerText = data.name;
            document.getElementById('sideTag').innerText = data.tier;

            let qaHtml = "";

                qaHtml = `

                    <div class="card-heading">Configuration Paths (.conf)</div>

                ${forwarderSection}

            `;

            document.getElementById('sideContent').innerHTML = `

                alarmNodes: ["node-hec"],
                amberNodes: ["node-idx_site1"],
                symptoms: ["CloudWatch/Kubernetes log forwarders receive HTTP 503 Server Busy.", "Ingested events dropped at client API boundaries."],
                recoverySteps: [
                    "In <code>inputs.conf</code> under <code>[http]</code>, increase <code>max_content_length</code> and queue limits.",
                    "Enable load balancing across multiple HEC tokens or scale out indexer HEC endpoints.",
                    "Enable channel-based indexer acknowledgment: <code>useACK = true</code>."
                ]
            }
        };

        function resetSimulation() {
            document.querySelectorAll('.node').forEach(n => {
                n.classList.remove('alarm-red', 'alarm-amber');
            });
            document.querySelectorAll('path').forEach(p => {
                p.classList.remove('pipe-severed');
            });
            renderSimulatorRunbook();
        }

        function runSimulation() {
            resetSimulation();
            const scenarioKey = document.getElementById('simScenarioSelect').value;
            const sc = failureScenarios[scenarioKey];
            if (!sc) return;

            sc.severPipes.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('pipe-severed');
            });

            sc.alarmNodes.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('alarm-red');
            });

            sc.amberNodes.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('alarm-amber');
            });

            renderSimulatorRunbook(sc);
        }

        function renderSimulatorRunbook(scenario = null) {
            document.getElementById('sideTitle').innerText = "Failure Simulator Console";
            document.getElementById('sideTag').innerText = "15 Enterprise Scenarios";

            if (!scenario) {
                document.getElementById('sideContent').innerHTML = `
                    <div class="card">
                        <div class="card-heading">15 Enterprise Outage Scenarios</div>
                        <p style="font-size:0.82rem; color:#cbd5e1; line-height:1.45;">
                            Use the top toolbar to inject simulated failures into the cluster. The canvas will animate severed network pipes, trigger alarms, and render diagnostic procedures.
                        </p>
                    </div>
                `;
                return;
            }

            document.getElementById('sideContent').innerHTML = `
                <div class="card alarm-card">
                    <div class="card-heading" style="color:var(--accent-red)">Outage Triggered: ${scenario.title}</div>
                    <ul class="bullet-list" style="margin-top:6px;">
                        ${scenario.symptoms.map(s => `<li style="color:#fca5a5;">${s}</li>`).join('')}
                    </ul>
                </div>

                <div class="card">
                    <div class="card-heading">Remediation & Incident Runbook</div>
                    <ul class="bullet-list">
                        ${scenario.recoverySteps.map(r => `<li>${r}</li>`).join('')}
                    </ul>
                </div>
            `;
        }

        const searchInput = document.getElementById('searchInput');
        const dropdown = document.getElementById('dropdownPanel');

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase().trim();
            if (!val) { dropdown.style.display = 'none'; return; }

            const results = Object.keys(splunkComponents).filter(k => 
                splunkComponents[k].name.toLowerCase().includes(val) ||
                splunkComponents[k].configs.some(c => c.toLowerCase().includes(val)) ||
                (splunkComponents[k].affinityDetails && splunkComponents[k].affinityDetails.toLowerCase().includes(val)) ||
                (splunkComponents[k].kvstoreDetails && splunkComponents[k].kvstoreDetails.toLowerCase().includes(val))
            );

            if (results.length > 0) {
                dropdown.innerHTML = results.map(k => `
                    <div class="dropdown-item" onclick="selectComponent('${k}')">
                        <div class="dropdown-q">${splunkComponents[k].name}</div>
                        <div class="dropdown-desc">${splunkComponents[k].tier}</div>
                    </div>
                `).join('');
                dropdown.style.display = 'block';
            } else {
                dropdown.style.display = 'none';
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) dropdown.style.display = 'none';
        });

        selectComponent('sh_captain');
    </script>
</body>
</html>
